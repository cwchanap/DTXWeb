name: Deploy Cloudflare Access

on:
  push:
    branches: [main]
    paths:
      - 'packages/infrastructure/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-cloudflare-access.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-pre-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dtx-access-pre-prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check infrastructure
        run: bun run --filter=@dtx/infrastructure check

      - name: Test infrastructure
        run: bun run --filter=@dtx/infrastructure test:coverage

      - name: Build infrastructure
        run: bun run --filter=@dtx/infrastructure build

      - name: Verify infrastructure build
        run: test -f packages/infrastructure/dist/index.js

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:cwchanap

      - name: Update pre-production Access
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: cwchanap/dtxweb-infrastructure/pre-prod
          work-dir: packages/infrastructure
          pulumi-version: '3.258.0'
          refresh: true
          suppress-outputs: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}

      - name: Verify pre-production Access boundary
        run: packages/infrastructure/scripts/verify-access.sh pre-prod

  deploy-production:
    needs: deploy-pre-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dtx-access-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check infrastructure
        run: bun run --filter=@dtx/infrastructure check

      - name: Test infrastructure
        run: bun run --filter=@dtx/infrastructure test:coverage

      - name: Build infrastructure
        run: bun run --filter=@dtx/infrastructure build

      - name: Verify infrastructure build
        run: test -f packages/infrastructure/dist/index.js

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:cwchanap

      - name: Update production Access
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: cwchanap/dtxweb-infrastructure/production
          work-dir: packages/infrastructure
          pulumi-version: '3.258.0'
          refresh: true
          suppress-outputs: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}

      - name: Verify production Access boundary
        run: packages/infrastructure/scripts/verify-access.sh production
