name: Desktop App Cross-Platform Build and Deploy

on:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - preview
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering
    inputs:
      version:
        description: 'Semver version (MAJOR.MINOR.PATCH) written to the updater manifest. Must exceed the currently installed version to be offered as an update.'
        required: true
        type: string

# Notes:
# - Tauri cannot cross-compile installers the way electron-builder+wine did,
#   so Windows now builds on windows-latest and macOS on macos-latest.
# - macOS targets aarch64 (Apple Silicon) only; Intel Macs are no longer
#   supported. If Intel support is needed in the future, add a second mac job
#   with `--target x86_64-apple-darwin` (or build universal-apple-darwin once
#   you confirm native deps support it), then add a `darwin-x86_64` entry to
#   latest.json in the deploy job.
# - The packaged app bakes public config into the binary at BUILD time via the
#   config_env! macro (option_env! first, std::env::var fallback). The packaged
#   binary does NOT load .env files, so every public config value used by the
#   Rust backend (PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY, VITE_DTX_API_URL,
#   PUBLIC_SIMFILE_BUCKET_URL) MUST be present in this CI environment for
#   option_env! to capture it during `tauri build`. VITE_DTX_SERVER_URL is also
#   required by the Vite renderer (authService login redirect) and is inlined at
#   frontend build time.

jobs:
  build-windows:
    name: Windows Tauri Build
    if: github.event_name != 'pull_request' || github.head_ref != 'preview'
    runs-on: windows-latest
    # NOTE: Renamed from the legacy "Electron" environment. The GitHub
    # repository's Environments settings must have a "Desktop" environment
    # (with the same secrets/variables) before this workflow is next run,
    # otherwise the environment lookup will fail.
    environment: Desktop
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      VITE_DTX_API_URL: ${{ vars.VITE_DTX_API_URL }}
      VITE_DTX_SERVER_URL: ${{ vars.VITE_DTX_SERVER_URL }}
      PUBLIC_SIMFILE_BUCKET_URL: ${{ vars.PUBLIC_SIMFILE_BUCKET_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Shared Package
        run: bun run --filter=@dtx/common build

      - name: Set Release Version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release version '$VERSION' is not valid SemVer (expected MAJOR.MINOR.PATCH, e.g. 1.0.1)."
            exit 1
          fi
          # Bake the version into tauri.conf.json — Tauri embeds this at build
          # time and the updater compares latest.json against it. Without this,
          # a manifest with 1.0.1 and a binary still reporting 1.0.0 causes
          # clients to re-offer the same update indefinitely.
          CONF="packages/dtx-desktop/src-tauri/tauri.conf.json"
          tmp=$(mktemp)
          jq --tab --arg v "$VERSION" '.version = $v' "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          # Keep Cargo.toml in sync (first 'version =' is the package version).
          CARGO="packages/dtx-desktop/src-tauri/Cargo.toml"
          tmp=$(mktemp)
          awk -v v="\"$VERSION\"" '/^version = / && !done {print "version = " v; done=1; next} {print}' "$CARGO" > "$tmp" && mv "$tmp" "$CARGO"
          echo "Baked release version $VERSION into tauri.conf.json and Cargo.toml"

      - name: Build Tauri App for Windows
        run: bun run --filter=dtx-desktop tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Organize Artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          BUNDLE_DIR="packages/dtx-desktop/src-tauri/target/release/bundle"
          # NSIS installer + updater signature. With createUpdaterArtifacts: true
          # (the Tauri v2 format), the NSIS setup .exe IS the updater bundle —
          # there is no separate .nsis.zip wrapper (that only exists for
          # "v1Compat"). The .exe.sig sidecar holds the minisign signature.
          cp "$BUNDLE_DIR/nsis/"*-setup.exe dist/artifacts/ 2>/dev/null || true
          cp "$BUNDLE_DIR/nsis/"*-setup.exe.sig dist/artifacts/ 2>/dev/null || true
          ls -la dist/artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-app-win
          path: dist/artifacts/
          retention-days: 5

  build-mac:
    name: macOS Tauri Build
    if: github.event_name != 'pull_request' || github.head_ref != 'preview'
    runs-on: macos-latest
    environment: Desktop
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      VITE_DTX_API_URL: ${{ vars.VITE_DTX_API_URL }}
      VITE_DTX_SERVER_URL: ${{ vars.VITE_DTX_SERVER_URL }}
      PUBLIC_SIMFILE_BUCKET_URL: ${{ vars.PUBLIC_SIMFILE_BUCKET_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Shared Package
        run: bun run --filter=@dtx/common build

      - name: Set Release Version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release version '$VERSION' is not valid SemVer (expected MAJOR.MINOR.PATCH, e.g. 1.0.1)."
            exit 1
          fi
          CONF="packages/dtx-desktop/src-tauri/tauri.conf.json"
          tmp=$(mktemp)
          jq --tab --arg v "$VERSION" '.version = $v' "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          CARGO="packages/dtx-desktop/src-tauri/Cargo.toml"
          tmp=$(mktemp)
          awk -v v="\"$VERSION\"" '/^version = / && !done {print "version = " v; done=1; next} {print}' "$CARGO" > "$tmp" && mv "$tmp" "$CARGO"
          echo "Baked release version $VERSION into tauri.conf.json and Cargo.toml"

      - name: Build Tauri App for macOS
        run: bun run --filter=dtx-desktop tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Organize Artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          BUNDLE_DIR="packages/dtx-desktop/src-tauri/target/release/bundle"
          # DMG installer (for first-time download)
          cp "$BUNDLE_DIR/dmg/"*.dmg dist/artifacts/ 2>/dev/null || true
          # Updater bundle + signature (consumed by the Tauri updater)
          cp "$BUNDLE_DIR/macos/"*.app.tar.gz dist/artifacts/ 2>/dev/null || true
          cp "$BUNDLE_DIR/macos/"*.app.tar.gz.sig dist/artifacts/ 2>/dev/null || true
          ls -la dist/artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-app-mac
          path: dist/artifacts/
          retention-days: 5

  deploy:
    name: Deploy to Cloudflare R2
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tauri-app-win
          path: dist/artifacts/win

      - name: Download macOS Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tauri-app-mac
          path: dist/artifacts/mac

      - name: Set Release Version
        id: version
        env:
          # Pass the manual input via env var instead of script interpolation
          # to avoid quote-escaping issues if `inputs.version` ever contains
          # shell metacharacters (defense in depth: workflow_dispatch still
          # requires write access to the repo).
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${INPUT_VERSION}"
          fi
          # Strip an optional leading 'v'. Tauri's updater requires a SemVer
          # version (MAJOR.MINOR.PATCH) in latest.json; a bare timestamp or a
          # malformed tag such as `vgarbage` would disable update checks until
          # a valid tagged release overwrites the manifest.
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release version '$VERSION' is not valid SemVer (expected MAJOR.MINOR.PATCH, e.g. 1.0.1)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Prepare Deployment Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifacts/all
          cp dist/artifacts/win/* dist/artifacts/all/ 2>/dev/null || true
          cp dist/artifacts/mac/* dist/artifacts/all/ 2>/dev/null || true

          R2_URL="${{ vars.R2_PUBLIC_URL }}"

          # Locate the Tauri updater bundles (not the .sig sidecars) and their
          # signature files. For Windows v2 artifacts the setup .exe is both the
          # installer and the updater bundle; its .exe.sig holds the minisign
          # signature. For macOS the .app.tar.gz is the updater bundle.
          WIN_BUNDLE=$(find dist/artifacts/all -maxdepth 1 -type f -name '*-setup.exe' -print -quit)
          MAC_BUNDLE=$(find dist/artifacts/all -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)

          if [[ -z "$WIN_BUNDLE" || -z "$MAC_BUNDLE" ]]; then
            echo "Missing Tauri updater bundle (expected *-setup.exe and .app.tar.gz)" >&2
            ls -la dist/artifacts/all/
            exit 1
          fi

          WIN_SIG_FILE="${WIN_BUNDLE}.sig"
          MAC_SIG_FILE="${MAC_BUNDLE}.sig"
          if [[ ! -f "$WIN_SIG_FILE" || ! -f "$MAC_SIG_FILE" ]]; then
            echo "Missing signature file (was TAURI_SIGNING_PRIVATE_KEY set at build time?)" >&2
            exit 1
          fi

          WIN_FILE=$(basename "$WIN_BUNDLE")
          MAC_FILE=$(basename "$MAC_BUNDLE")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build the Tauri updater manifest. jq --rawfile embeds each .sig's
          # full minisign block as a properly-escaped JSON string.
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "Release $VERSION" \
            --rawfile win_sig "$WIN_SIG_FILE" \
            --arg win_url "${R2_URL}/${WIN_FILE}" \
            --rawfile mac_sig "$MAC_SIG_FILE" \
            --arg mac_url "${R2_URL}/${MAC_FILE}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' \
            > dist/artifacts/all/latest.json

          echo "--- latest.json ---"
          cat dist/artifacts/all/latest.json
          echo "--- files ---"
          ls -la dist/artifacts/all/

      - name: Setup Bun for Wrangler
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Install Wrangler
        run: bun add --global wrangler

      - name: Deploy to Cloudflare R2 using Wrangler
        run: |
          for file in dist/artifacts/all/*; do
            filename=$(basename "$file")
            content_type="application/octet-stream"

            if [[ $filename == *.exe ]]; then
              content_type="application/vnd.microsoft.portable-executable"
            elif [[ $filename == *.dmg ]]; then
              content_type="application/x-apple-diskimage"
            elif [[ $filename == *.sig ]]; then
              content_type="text/plain"
            elif [[ $filename == *.json ]]; then
              content_type="application/json"
            elif [[ $filename == *.zip ]]; then
              content_type="application/zip"
            elif [[ $filename == *.gz ]]; then
              content_type="application/gzip"
            fi

            echo "Uploading $filename with content-type: $content_type"
            wrangler r2 object put "${{ vars.R2_BUCKET }}/$filename" --file="$file" \
              --content-type="$content_type" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create Release (for tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          name: Release ${{ env.VERSION }}
          files: |
            dist/artifacts/all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
