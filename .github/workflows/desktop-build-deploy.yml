name: Desktop App Cross-Platform Build and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    name: Cross-Platform Electron Build
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
      options: --user 1001
    environment: Electron

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App for Windows
        run: |
          npm run build -w=@dtx/common
          npm run build:win -w=dtx-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Organize Artifacts
        run: |
          mkdir -p dist/artifacts
          cp packages/dtx-desktop/dist/*.exe dist/artifacts/
          cp packages/dtx-desktop/dist/latest.yml dist/artifacts/latest.yml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-win
          path: dist/artifacts/
          retention-days: 5

  deploy:
    name: Deploy to Cloudflare R2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-app-win
          path: dist/artifacts

      - name: Set Release Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(date +'%Y%m%d%H%M%S')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Prepare Deployment Files
        run: |
          TAG_VERSION=${{ env.VERSION }}

          # Create a latest.json file for auto-updates
          cat > dist/artifacts/latest.json << EOF
          {
            "version": "$TAG_VERSION",
            "notes": "Release version $TAG_VERSION",
            "platforms": {
              "win64": {
                "file": "ddtx-desktop-1.0.0-setup.exe",
                "url": "${{ vars.R2_PUBLIC_URL }}/drumery-desktop-win-${TAG_VERSION}.exe"
              }
            }
          }
          EOF

          # List all deployment files
          ls -la dist/artifacts/
        shell: bash

      - name: Setup Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare R2 using Wrangler
        run: |
          # Create temporary wrangler.toml file
          cat > wrangler.toml << EOF
          name = "drumery-desktop"

          [[r2_buckets]]
          binding = "MY_BUCKET"
          bucket_name = "${{ vars.R2_BUCKET }}"
          EOF

          # Upload each file with appropriate content-type and cache-control
          for file in dist/artifacts/*; do
            filename=$(basename "$file")
            content_type="application/octet-stream"
            
            if [[ $filename == *.exe ]]; then
              content_type="application/vnd.microsoft.portable-executable"
            elif [[ $filename == *.yml ]] || [[ $filename == *.json ]]; then
              content_type="application/json"
            fi
            
            echo "Uploading $filename with content-type: $content_type"
            wrangler r2 object put "${{ vars.R2_BUCKET }}/$filename" --file="$file" \
              --content-type="$content_type" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create Release (for tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          name: Release ${{ env.VERSION }}
          files: |
            dist/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
