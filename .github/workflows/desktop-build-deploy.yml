name: Desktop App Cross-Platform Build and Deploy

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - preview
      - main
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering
    inputs:
      version:
        description: 'Semver version (MAJOR.MINOR.PATCH) written to the updater manifest. Must exceed the currently installed version to be offered as an update.'
        required: true
        type: string

# Notes:
# - Tauri cannot cross-compile installers the way electron-builder+wine did,
#   so Windows now builds on windows-latest and macOS on macos-latest.
# - macOS targets aarch64 (Apple Silicon) only; Intel Macs are no longer
#   supported. If Intel support is needed in the future, add a second mac job
#   with `--target x86_64-apple-darwin` (or build universal-apple-darwin once
#   you confirm native deps support it), then add a `darwin-x86_64` entry to
#   latest.json in the deploy job.
# - The packaged app bakes public config into the binary at BUILD time via the
#   config_env! macro (option_env! first, std::env::var fallback). The packaged
#   binary does NOT load .env files, so every public config value used by the
#   Rust backend (PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY, VITE_DTX_API_URL,
#   PUBLIC_SIMFILE_BUCKET_URL) MUST be present in this CI environment for
#   option_env! to capture it during `tauri build`. VITE_DTX_SERVER_URL is also
#   required by the Vite renderer (authService login redirect) and is inlined at
#   frontend build time.
# - Push to main is a CONTINUOUS RELEASE channel: every merge builds SIGNED
#   updater artifacts and uploads them (plus latest.json) to R2, using the
#   version committed in tauri.conf.json. Bump that version in the merge to
#   actually offer an update to installed clients; merges that don't bump it
#   re-publish the same version (a no-op for the updater). This requires the
#   TAURI_SIGNING_PRIVATE_KEY(/_PASSWORD) secrets in the Desktop environment,
#   or the signed main build will hard-fail. main and tagged releases share one
#   R2 bucket / latest.json, so each main merge overwrites the previous upload.

jobs:
  build-windows:
    permissions:
      contents: read
    name: Windows Tauri Build
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.head_ref != 'preview')
    runs-on: windows-latest
    # Each platform build targets its own GitHub environment so concurrent
    # build-windows / build-mac runs each get their own "active" deployment
    # record (a single shared environment would mark one of the two as
    # "inactive" purely because GitHub keeps only one active deployment per
    # environment at a time). The GitHub repository's Environments settings
    # must have "Desktop-Windows" and "Desktop-macOS" environments, each with
    # the build secrets (PUBLIC_SUPABASE_ANON_KEY, TAURI_SIGNING_PRIVATE_KEY).
    # The build vars (PUBLIC_SUPABASE_URL, VITE_DTX_API_URL,
    # VITE_DTX_SERVER_URL) live at repo level and are inherited by every
    # environment, so they do not need to be duplicated here.
    environment: Desktop-Windows
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      VITE_DTX_API_URL: ${{ vars.VITE_DTX_API_URL }}
      VITE_DTX_SERVER_URL: ${{ vars.VITE_DTX_SERVER_URL }}
      PUBLIC_SIMFILE_BUCKET_URL: ${{ vars.PUBLIC_SIMFILE_BUCKET_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Shared Package
        run: bun run --filter=@dtx/common build

      - name: Configure Google Drive build for preproduction
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/preview'
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_OAUTH_CLIENT_ID_PREPRODUCTION }}
        run: bash packages/dtx-desktop/src-tauri/scripts/validate_google_drive_build_env.sh preproduction

      - name: Configure Google Drive build for production
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/preview'
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_OAUTH_CLIENT_ID_PRODUCTION }}
        run: bash packages/dtx-desktop/src-tauri/scripts/validate_google_drive_build_env.sh production

      - name: Set Release Version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          CONF="packages/dtx-desktop/src-tauri/tauri.conf.json"
          CARGO="packages/dtx-desktop/src-tauri/Cargo.toml"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            # Push to main (continuous release): use the version committed in
            # tauri.conf.json. Bump it in the merge to offer a real update;
            # an unchanged version re-publishes the same release (updater no-op).
            VERSION="$(jq -r '.version' "$CONF")"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release version '$VERSION' is not valid SemVer (expected MAJOR.MINOR.PATCH, e.g. 1.0.1)."
            exit 1
          fi
          # Bake the version into tauri.conf.json — Tauri embeds this at build
          # time and the updater compares latest.json against it. Without this,
          # a manifest with 1.0.1 and a binary still reporting 1.0.0 causes
          # clients to re-offer the same update indefinitely.
          tmp=$(mktemp)
          jq --tab --arg v "$VERSION" '.version = $v' "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          # Keep Cargo.toml in sync (first 'version =' is the package version).
          tmp=$(mktemp)
          awk -v v="\"$VERSION\"" '/^version = / && !done {print "version = " v; done=1; next} {print}' "$CARGO" > "$tmp" && mv "$tmp" "$CARGO"
          # Re-enable updater artifact generation for this signed release build.
          # The committed tauri.conf.json ships with createUpdaterArtifacts=false
          # so that PR builds (which deliberately run WITHOUT the signing key)
          # and local builds without TAURI_SIGNING_PRIVATE_KEY don't hard-fail:
          # Tauri errors out whenever an updater-enabled target (nsis) is built
          # with a configured pubkey but no private key. Only signed release
          # builds (tag / workflow_dispatch / push to main) flip it back on,
          # where the signing key is present and the deploy job consumes the
          # .sig sidecars.
          tmp=$(mktemp)
          jq --tab '.bundle.createUpdaterArtifacts = true' "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          echo "Baked release version $VERSION into tauri.conf.json and Cargo.toml"

      # PR builds run unsigned: the updater signing key must never be exposed
      # to PR-controlled build scripts (beforeBuildCommand runs PR-controlled
      # Vite/Cargo code that could exfiltrate it). A leaked signing key lets an
      # attacker ship trusted updater bundles to every installed desktop client.
      # With createUpdaterArtifacts=false in the committed config, PR builds skip
      # signing entirely and succeed without the private key.
      - name: Build Tauri App for Windows (PR, unsigned)
        if: github.event_name == 'pull_request'
        run: bun run --filter=dtx-desktop tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri App for Windows (release, signed)
        if: github.event_name != 'pull_request'
        run: bun run --filter=dtx-desktop tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Organize Artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          BUNDLE_DIR="packages/dtx-desktop/src-tauri/target/release/bundle"
          # NSIS installer + updater signature. With createUpdaterArtifacts: true
          # (the Tauri v2 format), the NSIS setup .exe IS the updater bundle —
          # there is no separate .nsis.zip wrapper (that only exists for
          # "v1Compat"). The .exe.sig sidecar holds the minisign signature.
          cp "$BUNDLE_DIR/nsis/"*-setup.exe dist/artifacts/ 2>/dev/null || true
          cp "$BUNDLE_DIR/nsis/"*-setup.exe.sig dist/artifacts/ 2>/dev/null || true
          ls -la dist/artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-app-win
          path: dist/artifacts/
          retention-days: 5

  build-mac:
    permissions:
      contents: read
    name: macOS Tauri Build
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.head_ref != 'preview')
    runs-on: macos-latest
    # See build-windows for the rationale on per-platform environments.
    environment: Desktop-macOS
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      VITE_DTX_API_URL: ${{ vars.VITE_DTX_API_URL }}
      VITE_DTX_SERVER_URL: ${{ vars.VITE_DTX_SERVER_URL }}
      PUBLIC_SIMFILE_BUCKET_URL: ${{ vars.PUBLIC_SIMFILE_BUCKET_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Shared Package
        run: bun run --filter=@dtx/common build

      - name: Configure Google Drive build for preproduction
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/preview'
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_OAUTH_CLIENT_ID_PREPRODUCTION }}
        run: bash packages/dtx-desktop/src-tauri/scripts/validate_google_drive_build_env.sh preproduction

      - name: Configure Google Drive build for production
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/preview'
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_OAUTH_CLIENT_ID_PRODUCTION }}
        run: bash packages/dtx-desktop/src-tauri/scripts/validate_google_drive_build_env.sh production

      - name: Set Release Version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          CONF="packages/dtx-desktop/src-tauri/tauri.conf.json"
          CARGO="packages/dtx-desktop/src-tauri/Cargo.toml"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            # Push to main (continuous release): use the committed tauri.conf.json
            # version. See the Windows job for the full rationale.
            VERSION="$(jq -r '.version' "$CONF")"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release version '$VERSION' is not valid SemVer (expected MAJOR.MINOR.PATCH, e.g. 1.0.1)."
            exit 1
          fi
          tmp=$(mktemp)
          jq --tab --arg v "$VERSION" '.version = $v' "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          tmp=$(mktemp)
          awk -v v="\"$VERSION\"" '/^version = / && !done {print "version = " v; done=1; next} {print}' "$CARGO" > "$tmp" && mv "$tmp" "$CARGO"
          # Re-enable updater artifact generation for this signed release build.
          # See the Windows job for the full rationale: the committed config
          # ships createUpdaterArtifacts=false so unsigned PR/local builds don't
          # hard-fail on the missing TAURI_SIGNING_PRIVATE_KEY.
          tmp=$(mktemp)
          jq --tab '.bundle.createUpdaterArtifacts = true' "$CONF" > "$tmp" && mv "$tmp" "$CONF"
          echo "Baked release version $VERSION into tauri.conf.json and Cargo.toml"

      - name: Build Tauri App for macOS (PR, unsigned)
        if: github.event_name == 'pull_request'
        run: bun run --filter=dtx-desktop tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri App for macOS (release, signed)
        if: github.event_name != 'pull_request'
        run: bun run --filter=dtx-desktop tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Organize Artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          BUNDLE_DIR="packages/dtx-desktop/src-tauri/target/release/bundle"
          # DMG installer (for first-time download)
          cp "$BUNDLE_DIR/dmg/"*.dmg dist/artifacts/ 2>/dev/null || true
          # Updater bundle + signature (consumed by the Tauri updater)
          cp "$BUNDLE_DIR/macos/"*.app.tar.gz dist/artifacts/ 2>/dev/null || true
          cp "$BUNDLE_DIR/macos/"*.app.tar.gz.sig dist/artifacts/ 2>/dev/null || true
          ls -la dist/artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-app-mac
          path: dist/artifacts/
          retention-days: 5

  deploy:
    permissions:
      contents: read
    name: Deploy to Cloudflare R2
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    # The deploy job pushes signed updater artifacts + latest.json to the
    # production R2 bucket. No `environment:` is set: the Cloudflare
    # secrets/vars it needs (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
    # R2_BUCKET, R2_PUBLIC_URL) are repo-level and inherited everywhere, and
    # 'Production' is reserved for the web app. Build jobs use per-platform
    # environments (Desktop-Windows / Desktop-macOS) so they each get their
    # own active deployment record.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No git operations are needed here (R2 upload only), so do not
          # persist the GITHUB_TOKEN credential beyond checkout.
          persist-credentials: false

      - name: Download Windows Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tauri-app-win
          path: dist/artifacts/win

      - name: Download macOS Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tauri-app-mac
          path: dist/artifacts/mac

      - name: Set Release Version
        id: version
        env:
          # Pass the manual input via env var instead of script interpolation
          # to avoid quote-escaping issues if `inputs.version` ever contains
          # shell metacharacters (defense in depth: workflow_dispatch still
          # requires write access to the repo).
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            # Push to main (continuous release): read the committed version the
            # build jobs baked into the binaries and bundle filenames, so
            # latest.json matches exactly what the updater compares against.
            VERSION="$(jq -r '.version' packages/dtx-desktop/src-tauri/tauri.conf.json)"
          fi
          # Strip an optional leading 'v'. Tauri's updater requires a SemVer
          # version (MAJOR.MINOR.PATCH) in latest.json; a bare timestamp or a
          # malformed tag such as `vgarbage` would disable update checks until
          # a valid tagged release overwrites the manifest.
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release version '$VERSION' is not valid SemVer (expected MAJOR.MINOR.PATCH, e.g. 1.0.1)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Prepare Deployment Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifacts/all
          cp dist/artifacts/win/* dist/artifacts/all/ 2>/dev/null || true
          cp dist/artifacts/mac/* dist/artifacts/all/ 2>/dev/null || true

          R2_URL="${{ vars.R2_PUBLIC_URL }}"

          # Locate the Tauri updater bundles (not the .sig sidecars) and their
          # signature files. For Windows v2 artifacts the setup .exe is both the
          # installer and the updater bundle; its .exe.sig holds the minisign
          # signature. For macOS the .app.tar.gz is the updater bundle.
          WIN_BUNDLE=$(find dist/artifacts/all -maxdepth 1 -type f -name '*-setup.exe' -print -quit)
          MAC_BUNDLE=$(find dist/artifacts/all -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)

          if [[ -z "$WIN_BUNDLE" || -z "$MAC_BUNDLE" ]]; then
            echo "Missing Tauri updater bundle (expected *-setup.exe and .app.tar.gz)" >&2
            ls -la dist/artifacts/all/
            exit 1
          fi

          WIN_SIG_FILE="${WIN_BUNDLE}.sig"
          MAC_SIG_FILE="${MAC_BUNDLE}.sig"
          if [[ ! -f "$WIN_SIG_FILE" || ! -f "$MAC_SIG_FILE" ]]; then
            echo "Missing signature file (was TAURI_SIGNING_PRIVATE_KEY set at build time?)" >&2
            exit 1
          fi

          WIN_FILE=$(basename "$WIN_BUNDLE")
          MAC_FILE=$(basename "$MAC_BUNDLE")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build the Tauri updater manifest. jq --rawfile embeds each .sig's
          # full minisign block as a properly-escaped JSON string.
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "Release $VERSION" \
            --rawfile win_sig "$WIN_SIG_FILE" \
            --arg win_url "${R2_URL}/${WIN_FILE}" \
            --rawfile mac_sig "$MAC_SIG_FILE" \
            --arg mac_url "${R2_URL}/${MAC_FILE}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' \
            > dist/artifacts/all/latest.json

          echo "--- latest.json ---"
          cat dist/artifacts/all/latest.json
          echo "--- files ---"
          ls -la dist/artifacts/all/

      - name: Setup Bun for Wrangler
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Install Wrangler
        run: bun add --global wrangler

      - name: Deploy to Cloudflare R2 using Wrangler
        run: |
          for file in dist/artifacts/all/*; do
            filename=$(basename "$file")
            content_type="application/octet-stream"

            if [[ $filename == *.exe ]]; then
              content_type="application/vnd.microsoft.portable-executable"
            elif [[ $filename == *.dmg ]]; then
              content_type="application/x-apple-diskimage"
            elif [[ $filename == *.sig ]]; then
              content_type="text/plain"
            elif [[ $filename == *.json ]]; then
              content_type="application/json"
            elif [[ $filename == *.zip ]]; then
              content_type="application/zip"
            elif [[ $filename == *.gz ]]; then
              content_type="application/gzip"
            fi

            echo "Uploading $filename with content-type: $content_type"
            wrangler r2 object put "${{ vars.R2_BUCKET }}/$filename" --file="$file" \
              --content-type="$content_type" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Publish the fully-staged asset directory (build artifacts + latest.json)
      # as a workflow artifact so the tag-only release job can attach exactly
      # what was published to R2 — including the updater manifest, which the
      # release job cannot reconstruct on its own. Gated to tags because the
      # release job only runs on tag pushes; main-push continuous releases do
      # not need a GitHub release.
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/artifacts/all/
          retention-days: 5

  # GitHub release creation is split into its own tag-only job so the
  # `contents: write` permission is scoped to the single step that needs it
  # (softprops/action-gh-release). The R2 deploy job above runs with only
  # `contents: read`, limiting supply-chain exposure across checkout, artifact
  # processing, and the dynamically installed wrangler package. The release
  # job runs only on tag pushes and consumes the staged release-assets
  # artifact (build artifacts + latest.json) produced by the deploy job, so it
  # does not duplicate manifest generation or re-stage platform artifacts.
  release:
    permissions:
      contents: write
    name: Create GitHub Release (tags only)
    needs: deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download Release Assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/artifacts/all

      - name: Set Release Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(jq -r '.version' packages/dtx-desktop/src-tauri/tauri.conf.json)"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release version '$VERSION' is not valid SemVer (expected MAJOR.MINOR.PATCH, e.g. 1.0.1)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          name: Release ${{ env.VERSION }}
          files: |
            dist/artifacts/all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
