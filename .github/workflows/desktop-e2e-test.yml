name: Desktop E2E Test

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/dtx-desktop/**'
      - 'packages/e2e-desktop/**'
      - 'packages/common/**'
      - 'packages/ui-components/**'
      - '.github/workflows/desktop-e2e-test.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'packages/dtx-desktop/**'
      - 'packages/e2e-desktop/**'
      - 'packages/common/**'
      - 'packages/ui-components/**'
      - '.github/workflows/desktop-e2e-test.yml'

permissions:
  contents: read

jobs:
  desktop-e2e:
    name: Tauri Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test-enabled desktop app
        run: bun run --filter=dtx-e2e-desktop e2e:build

      - name: Run desktop integration test
        run: xvfb-run -a bun run --filter=dtx-e2e-desktop e2e:run

      - name: Upload desktop e2e logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-logs
          path: packages/e2e-desktop/logs/
          if-no-files-found: warn
