name: Desktop E2E Test

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/dtx-desktop/**'
      - 'packages/e2e-desktop/**'
      - 'packages/common/**'
      - 'packages/ui-components/**'
      - '.github/workflows/desktop-e2e-test.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.base.json'
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/dtx-desktop/**'
      - 'packages/e2e-desktop/**'
      - 'packages/common/**'
      - 'packages/ui-components/**'
      - '.github/workflows/desktop-e2e-test.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.base.json'

permissions:
  contents: read

jobs:
  desktop-e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Tauri Integration Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          # e2e builds emit to a dedicated target dir (CARGO_TARGET_DIR=target-e2e)
          # to avoid invalidating `tauri dev` artifacts; cache it too.
          cache-directories: packages/dtx-desktop/src-tauri/target-e2e
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared packages
        run: bun run --filter=@dtx/common build && bun run --filter=@dtx/ui-components build

      - name: Run harness unit tests
        run: bun run --filter=dtx-e2e-desktop test:harness

      - name: Configure Rust coverage instrumentation
        if: runner.os == 'macOS'
        working-directory: packages/dtx-desktop/src-tauri
        run: |
          export CARGO_TARGET_DIR="$PWD/target-e2e"
          cargo llvm-cov show-env --sh > coverage-env.sh
          source coverage-env.sh
          cargo llvm-cov clean --workspace

      - name: Build test-enabled desktop app
        run: |
          if [ "$RUNNER_OS" = macOS ]; then source packages/dtx-desktop/src-tauri/coverage-env.sh; fi
          bun run --filter=dtx-e2e-desktop e2e:build

      - name: Run desktop integration and relaunch tests
        run: |
          if [ "$RUNNER_OS" = macOS ]; then source packages/dtx-desktop/src-tauri/coverage-env.sh; fi
          mkdir -p packages/e2e-desktop/logs
          set -o pipefail
          bun run --filter=dtx-e2e-desktop e2e:run 2>&1 | tee packages/e2e-desktop/logs/runner.log

      # TEMPORARY (HPA-316 task 4): OS-named workspace library screenshot for a
      # vision-capable reviewer; remove this step with the spec capture.
      - name: Upload workspace library visual evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-visual-evidence-${{ matrix.os }}
          path: packages/e2e-desktop/visual-evidence/
          if-no-files-found: error

      - name: Generate desktop E2E Rust coverage
        if: runner.os == 'macOS'
        working-directory: packages/dtx-desktop/src-tauri
        run: |
          source coverage-env.sh
          cargo llvm-cov report --lcov --output-path e2e-lcov.info

      - name: Upload desktop E2E Rust coverage artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-rust-lcov
          path: packages/dtx-desktop/src-tauri/e2e-lcov.info
          if-no-files-found: error

      - name: Upload desktop E2E Rust coverage to Codecov
        if: runner.os == 'macOS'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/dtx-desktop/src-tauri/e2e-lcov.info
          flags: desktop-e2e-rust
          fail_ci_if_error: false

      - name: Upload desktop e2e logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-logs-${{ matrix.os }}
          path: packages/e2e-desktop/logs/
          if-no-files-found: warn
