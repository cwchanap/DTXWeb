name: Desktop E2E Test

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/dtx-desktop/**'
      - 'packages/e2e-desktop/**'
      - 'packages/common/**'
      - 'packages/ui-components/**'
      - '.github/workflows/desktop-e2e-test.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/dtx-desktop/**'
      - 'packages/e2e-desktop/**'
      - 'packages/common/**'
      - 'packages/ui-components/**'
      - '.github/workflows/desktop-e2e-test.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'

permissions:
  contents: read

jobs:
  desktop-e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Tauri Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-llvm-cov

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          # e2e builds emit to a dedicated target dir (CARGO_TARGET_DIR=target-e2e)
          # to avoid invalidating `tauri dev` artifacts; cache it too.
          cache-directories: packages/dtx-desktop/src-tauri/target-e2e
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared packages
        run: bun run --filter=@dtx/common build && bun run --filter=@dtx/ui-components build

      - name: Configure Rust coverage instrumentation
        shell: bash
        working-directory: packages/dtx-desktop/src-tauri
        run: |
          export CARGO_TARGET_DIR="$PWD/target-e2e"
          cargo llvm-cov show-env --sh > coverage-env.sh
          source coverage-env.sh
          cargo llvm-cov clean --workspace

      - name: Build test-enabled desktop app
        shell: bash
        run: |
          source packages/dtx-desktop/src-tauri/coverage-env.sh
          bun run --filter=dtx-e2e-desktop e2e:build

      - name: Run desktop integration and relaunch tests
        shell: bash
        run: |
          source packages/dtx-desktop/src-tauri/coverage-env.sh
          mkdir -p packages/e2e-desktop/logs
          set -o pipefail
          xvfb-run -a bun run --filter=dtx-e2e-desktop e2e:run 2>&1 | tee packages/e2e-desktop/logs/runner.log

      - name: Generate desktop E2E Rust coverage
        shell: bash
        working-directory: packages/dtx-desktop/src-tauri
        run: |
          source coverage-env.sh
          cargo llvm-cov report --lcov --output-path e2e-lcov.info

      - name: Upload desktop E2E Rust coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-rust-lcov
          path: packages/dtx-desktop/src-tauri/e2e-lcov.info
          if-no-files-found: error

      - name: Upload desktop E2E Rust coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/dtx-desktop/src-tauri/e2e-lcov.info
          fail_ci_if_error: true

      - name: Upload desktop e2e logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-logs
          path: packages/e2e-desktop/logs/
          if-no-files-found: warn
