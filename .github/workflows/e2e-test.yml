name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/dtx-web/**'
      - 'packages/dtx-api/**'
      - 'packages/common/**'
      - 'packages/ui-components/**'
      - 'packages/e2e-web/**'
      - '.github/workflows/e2e-test.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.base.json'

permissions:
  contents: read

jobs:
  test:
    name: playwright
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      E2E_USER_EMAIL: e2e@drumery.test
      E2E_USER_PASSWORD: e2e-password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install --frozen-lockfile && bun run --filter=@dtx/common build
      - name: Install Playwright Browsers
        run: bun run --filter=dtx-e2e-web playwright install --with-deps
      - name: Run Playwright tests
        run: bun run --filter=dtx-e2e-web e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/e2e-web/playwright-report/
          retention-days: 30
