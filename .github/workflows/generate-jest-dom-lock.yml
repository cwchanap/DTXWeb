name: Generate jest-dom v7 lockfile

on:
  push:
    branches:
      - chore/jest-dom-v7

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/jest-dom-v7
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Regenerate lockfile
        run: bun install

      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          if git diff --cached --quiet; then
            echo 'bun.lock already up to date'
          else
            git commit -m 'chore(deps): regenerate bun lockfile'
            git push origin HEAD:chore/jest-dom-v7
          fi

      - name: Verify frozen install
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run --filter=@dtx/common build

      - name: Run affected unit tests
        run: |
          bun run --filter=@dtx/common test
          bun run --filter=dtx-web test
          bun run --filter=dtx-desktop test

      - name: Run workspace checks
        run: bun run check

      - name: Run workspace lint
        run: bun run lint
