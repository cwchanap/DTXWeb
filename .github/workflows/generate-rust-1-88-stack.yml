name: Generate Rust 1.88 dependency stack

on:
  push:
    branches:
      - chore/rust-1.88-dependency-stack

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/rust-1.88-dependency-stack
          persist-credentials: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Apply coordinated toolchain and manifest changes
        run: |
          python - <<'PY'
          from pathlib import Path

          cargo_path = Path('packages/dtx-desktop/src-tauri/Cargo.toml')
          cargo = cargo_path.read_text()
          replacements = {
              'rust-version = "1.77.2"': 'rust-version = "1.88"',
              'base64 = "0.22"': 'base64 = "0.23"',
              'rusqlite = { version = "0.32", features = ["bundled"] }': 'rusqlite = { version = "0.40", features = ["bundled"] }',
              'ts-rs = "10.1"': 'ts-rs = "12.0"',
              'time = { version = "=0.3.37", features = ["formatting"] }': 'time = { version = "=0.3.47", features = ["formatting"] }',
          }
          for old, new in replacements.items():
              if old not in cargo:
                  raise SystemExit(f'Missing expected Cargo.toml text: {old}')
              cargo = cargo.replace(old, new, 1)
          cargo_path.write_text(cargo)

          toolchain = '''[toolchain]\nchannel = "1.88.0"\nprofile = "minimal"\ncomponents = ["clippy", "rustfmt", "llvm-tools-preview"]\n'''
          Path('rust-toolchain.toml').write_text(toolchain)

          docs_path = Path('CLAUDE.md')
          docs = docs_path.read_text()
          old_docs = 'Rust 1.77 / edition 2021'
          if old_docs not in docs:
              raise SystemExit(f'Missing expected CLAUDE.md text: {old_docs}')
          docs_path.write_text(docs.replace(old_docs, 'Rust 1.88 / edition 2021', 1))

          workflow_paths = [
              Path('.github/workflows/tauri-rust-ci.yml'),
              Path('.github/workflows/desktop-e2e-test.yml'),
              Path('.github/workflows/desktop-build-deploy.yml'),
          ]
          for path in workflow_paths:
              lines = path.read_text().splitlines()
              output = []
              index = 0
              matched = 0
              while index < len(lines):
                  line = lines[index]
                  output.append(line)
                  if 'uses: dtolnay/rust-toolchain@' in line:
                      matched += 1
                      indent = line[: len(line) - len(line.lstrip())]
                      if index + 1 < len(lines) and lines[index + 1].strip() == 'with:':
                          index += 1
                          output.append(lines[index])
                          output.append(f'{indent}  toolchain: 1.88.0')
                      else:
                          output.append(f'{indent}with:')
                          output.append(f'{indent}  toolchain: 1.88.0')
                  index += 1
              if matched == 0:
                  raise SystemExit(f'No Rust setup step found in {path}')
              path.write_text('\n'.join(output) + '\n')
          PY

      - name: Resolve coordinated Cargo updates
        working-directory: packages/dtx-desktop/src-tauri
        run: |
          cargo update -p base64@0.22.1 --precise 0.23.0
          cargo update -p rusqlite@0.32.1 --precise 0.40.1
          cargo update -p ts-rs@10.1.0 --precise 12.0.1
          cargo update -p time@0.3.37 --precise 0.3.47
          cargo update -p quinn-proto@0.11.14 --precise 0.11.16
          cargo update -p serde_with@3.13.0 --precise 3.17.0

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Generate native TypeScript bindings twice
        run: |
          bun run gen:native-types
          cp packages/e2e-desktop/support/generated/native-types.ts /tmp/native-types.ts
          bun run gen:native-types
          cmp /tmp/native-types.ts packages/e2e-desktop/support/generated/native-types.ts

      - name: Verify Rust formatting
        working-directory: packages/dtx-desktop/src-tauri
        run: cargo fmt --check

      - name: Verify Rust linting
        working-directory: packages/dtx-desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run default Rust tests
        working-directory: packages/dtx-desktop/src-tauri
        run: cargo test --locked

      - name: Run E2E-feature Rust tests
        working-directory: packages/dtx-desktop/src-tauri
        env:
          DTX_DESKTOP_BUILD_ENV: e2e
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ''
          GOOGLE_DRIVE_OAUTH_CLIENT_ENV: ''
        run: cargo test --locked --no-default-features --features e2e

      - name: Commit generated Rust stack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust-toolchain.toml \
            CLAUDE.md \
            .github/workflows/tauri-rust-ci.yml \
            .github/workflows/desktop-e2e-test.yml \
            .github/workflows/desktop-build-deploy.yml \
            packages/dtx-desktop/src-tauri/Cargo.toml \
            packages/dtx-desktop/src-tauri/Cargo.lock \
            packages/e2e-desktop/support/generated/native-types.ts
          if git diff --cached --quiet; then
            echo 'Rust stack already up to date'
          else
            git commit -m 'chore(desktop): upgrade Rust toolchain and dependency stack'
            git push origin HEAD:chore/rust-1.88-dependency-stack
          fi
