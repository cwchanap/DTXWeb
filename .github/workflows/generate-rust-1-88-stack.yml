name: Generate Rust 1.95 dependency stack

on:
  push:
    branches:
      - chore/rust-1.88-dependency-stack
  pull_request:
    branches:
      - main

concurrency:
  group: generate-rust-1-95-stack
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/rust-1.88-dependency-stack
          persist-credentials: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Set up Rust 1.95
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Align contributor guide and production workflow pins
        run: |
          python - <<'PY'
          from pathlib import Path

          docs_path = Path('CLAUDE.md')
          docs = docs_path.read_text()
          docs = docs.replace('Rust 1.88 / edition 2021', 'Rust 1.95 / edition 2021')
          docs_path.write_text(docs)

          for path in [
              Path('.github/workflows/tauri-rust-ci.yml'),
              Path('.github/workflows/desktop-e2e-test.yml'),
              Path('.github/workflows/desktop-build-deploy.yml'),
          ]:
              text = path.read_text().replace('toolchain: 1.88.0', 'toolchain: 1.95.0')
              path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md \
            .github/workflows/tauri-rust-ci.yml \
            .github/workflows/desktop-e2e-test.yml \
            .github/workflows/desktop-build-deploy.yml
          if git diff --cached --quiet; then
            echo 'Rust 1.95 documentation and workflow pins already aligned'
          else
            git commit -m 'chore(desktop): align CI and docs with Rust 1.95'
            git push origin HEAD:chore/rust-1.88-dependency-stack
          fi

      - name: Resolve manifest-required Cargo updates
        working-directory: packages/dtx-desktop/src-tauri
        run: cargo check

      - name: Update reviewed transitive dependencies
        working-directory: packages/dtx-desktop/src-tauri
        run: |
          cargo update -p quinn-proto@0.11.14 --precise 0.11.16
          cargo update -p serde_with@3.13.0 --precise 3.21.0
          cargo check --locked

      - name: Verify target dependency versions
        working-directory: packages/dtx-desktop/src-tauri
        run: |
          cargo tree -i base64@0.23.0
          cargo tree -i rusqlite@0.40.1
          cargo tree -i ts-rs@12.0.1
          cargo tree -i time@0.3.47
          cargo tree --target all -i quinn-proto@0.11.16
          cargo tree --target all -i serde_with@3.21.0

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Generate native TypeScript bindings twice
        run: |
          bun run gen:native-types
          cp packages/e2e-desktop/support/generated/native-types.ts /tmp/native-types.ts
          bun run gen:native-types
          cmp /tmp/native-types.ts packages/e2e-desktop/support/generated/native-types.ts

      - name: Commit lockfile and generated bindings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/dtx-desktop/src-tauri/Cargo.lock \
            packages/e2e-desktop/support/generated/native-types.ts
          if git diff --cached --quiet; then
            echo 'Cargo lockfile and native bindings already up to date'
          else
            git commit -m 'chore(desktop): update Rust dependency lockfile and bindings'
            git push origin HEAD:chore/rust-1.88-dependency-stack
          fi

      - name: Apply Rust 1.95 clippy migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('packages/dtx-desktop/src-tauri/src/auth.rs')
          auth = auth_path.read_text()
          old_auth = '''jwt_exp_seconds(token)
                        .map_or(true, |exp| exp - unix_now_secs() <= TOKEN_REFRESH_SKEW_SECS)'''
          new_auth = '''jwt_exp_seconds(token)
                        .is_none_or(|exp| exp - unix_now_secs() <= TOKEN_REFRESH_SKEW_SECS)'''
          if old_auth not in auth and new_auth not in auth:
              raise SystemExit('Expected auth clippy expression was not found')
          auth_path.write_text(auth.replace(old_auth, new_auth, 1))

          test_path = Path('packages/dtx-desktop/src-tauri/src/tests/google_drive_oauth_tests.rs')
          test = test_path.read_text()
          old_test = "std::iter::repeat(b'X').take(MAX_CALLBACK_REQUEST_BYTES + 1)"
          new_test = "std::iter::repeat_n(b'X', MAX_CALLBACK_REQUEST_BYTES + 1)"
          if old_test not in test and new_test not in test:
              raise SystemExit('Expected OAuth test iterator expression was not found')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/dtx-desktop/src-tauri/src/auth.rs \
            packages/dtx-desktop/src-tauri/src/tests/google_drive_oauth_tests.rs
          if git diff --cached --quiet; then
            echo 'Rust 1.95 clippy migrations already applied'
          else
            git commit -m 'refactor(desktop): adopt Rust 1.95 idioms'
            git push origin HEAD:chore/rust-1.88-dependency-stack
          fi

      - name: Verify Rust formatting
        working-directory: packages/dtx-desktop/src-tauri
        run: cargo fmt --check

      - name: Verify Rust linting
        working-directory: packages/dtx-desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run default Rust tests
        working-directory: packages/dtx-desktop/src-tauri
        run: cargo test --locked

      - name: Run E2E-feature Rust tests
        working-directory: packages/dtx-desktop/src-tauri
        env:
          DTX_DESKTOP_BUILD_ENV: e2e
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ''
          GOOGLE_DRIVE_OAUTH_CLIENT_ENV: ''
        run: cargo test --locked --no-default-features --features e2e
