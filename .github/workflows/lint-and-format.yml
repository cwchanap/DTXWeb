name: Lint and Format

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate SvelteKit types
        run: |
          npm run build -w=dtx-web -- --mode types-only \
            || (cd packages/dtx-web && npx svelte-kit sync)
        working-directory: ${{ github.workspace }}

      - name: Build packages
        run: npm run build -w=@dtx/common

      - name: Run linting
        run: npm run lint

      - name: Run formatting check
        run: npx prettier --check .
