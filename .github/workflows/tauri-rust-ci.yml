name: Tauri Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Minimal permissions: this workflow only builds, lints, and tests — it never
# pushes commits, creates releases, or deploys. Reduces blast radius if the
# job environment is compromised.
permissions:
  contents: read

# Notes:
# - lib.rs calls `tauri::generate_context!()`, which embeds the frontend
#   (`frontendDist: ../dist`) at compile time. A stub dist with a minimal
#   index.html is enough to satisfy the codegen for compile/lint/test — the
#   Rust unit tests use wiremock/tempfile, not the real frontend.
# - `--locked` is safe because src-tauri/Cargo.lock is committed.

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dtx-desktop/src-tauri

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Prepare frontend dist for codegen
        run: |
          mkdir -p ../dist
          [ -f ../dist/index.html ] || \
            printf '<!DOCTYPE html><html><head></head><body></body></html>' > ../dist/index.html

      - name: Check formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee fmt.log

      - name: Upload formatting diagnostics
        if: failure() && hashFiles('packages/dtx-desktop/src-tauri/fmt.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-fmt-log
          path: packages/dtx-desktop/src-tauri/fmt.log
          if-no-files-found: error

      - name: Run clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee clippy.log

      - name: Upload clippy diagnostics
        if: failure() && hashFiles('packages/dtx-desktop/src-tauri/clippy.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-clippy-log
          path: packages/dtx-desktop/src-tauri/clippy.log
          if-no-files-found: error

      - name: Build
        run: cargo build --locked

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dtx-desktop/src-tauri

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-llvm-cov

      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/dtx-desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Prepare frontend dist for codegen
        run: |
          mkdir -p ../dist
          [ -f ../dist/index.html ] || \
            printf '<!DOCTYPE html><html><head></head><body></body></html>' > ../dist/index.html

      - name: Run default and E2E-feature tests with coverage
        shell: bash
        run: |
          set -o pipefail
          {
            cargo llvm-cov clean --workspace
            # The real-platform keyring smoke tests are `#[ignore]`'d
            # because they touch the host OS credential store (and the
            # headless Ubuntu runner lacks an interactive credential
            # service). `cargo test` skips them by default, so no
            # --skip filter is needed. The injected keyring adapter
            # round-trip remains covered in CI.
            cargo llvm-cov --no-report --locked
            DTX_DESKTOP_BUILD_ENV=e2e \
              GOOGLE_DRIVE_OAUTH_CLIENT_ID='' \
              GOOGLE_DRIVE_OAUTH_CLIENT_ENV='' \
              cargo llvm-cov --no-report --locked --no-default-features --features e2e
            cargo llvm-cov report --lcov --output-path lcov.info
          } 2>&1 | tee coverage.log

      - name: Upload coverage test diagnostics
        if: failure() && hashFiles('packages/dtx-desktop/src-tauri/coverage.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-coverage-log
          path: packages/dtx-desktop/src-tauri/coverage.log
          if-no-files-found: error

      - name: Verify generated TypeScript types are in sync
        working-directory: ${{ github.workspace }}
        run: |
          git ls-files --error-unmatch -- packages/e2e-desktop/support/generated/native-types.ts
          git diff --exit-code -- packages/e2e-desktop/support/generated/native-types.ts

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-rust-lcov
          path: packages/dtx-desktop/src-tauri/lcov.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        # Codecov merges this Rust upload with the TypeScript coverage uploaded
        # by unit-test.yml for the same commit, so overall coverage spans both.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/dtx-desktop/src-tauri/lcov.info
          fail_ci_if_error: true
