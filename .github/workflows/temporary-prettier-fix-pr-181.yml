name: Temporary Prettier Fix PR 181

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format failing docs
        run: |
          bunx prettier --write \
            docs/superpowers/plans/2026-08-07-hpa-537-preview-notation-navigation.md \
            docs/superpowers/specs/2026-08-07-hpa-537-preview-notation-navigation-design.md

      - name: Commit formatting
        run: |
          if git diff --quiet -- \
            docs/superpowers/plans/2026-08-07-hpa-537-preview-notation-navigation.md \
            docs/superpowers/specs/2026-08-07-hpa-537-preview-notation-navigation-design.md; then
            echo "No formatting changes needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-08-07-hpa-537-preview-notation-navigation.md \
            docs/superpowers/specs/2026-08-07-hpa-537-preview-notation-navigation-design.md
          git commit -m "style(docs): format HPA-537 plans"
          git push origin HEAD:"$GITHUB_REF_NAME"
