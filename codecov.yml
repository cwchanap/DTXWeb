# Codecov provides coverage reporting and policy statuses; it is not a
# branch-protection gate.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure

flag_management:
  individual_flags:
    - name: typescript
      carryforward: true
    - name: tauri-rust
      carryforward: true
    - name: desktop-e2e-rust
      carryforward: true
