type ChartScore {
  clearCount: Int!
  id: ID!
  playCount: Int!
  scores: [Score!]!
}

input ChartScoresInput {
  chartId: ID!
  clearCount: Int!
  playCount: Int!
  scores: [ScoreInput!]!
}

input CreateSimfileInput {
  artist: String
  bpm: Float!
  displayId: Int
  downloadUrl: String
  dtxFiles: [DtxFileInput!]
  isPublished: Boolean
  previewUrl: String
  publishDate: String
  title: String
  videoPreviewUrl: String
}

type DeleteResult {
  deleted: Boolean!
  id: ID!
  message: String
  partialDeletion: Boolean
}

type DtxFile {
  fileEncoding: FileEncoding!
  fileSizeBytes: Int!
  fileUrl: String
  id: ID!
  label: String!
  level: Float!
  myChartScore: ChartScore
}

input DtxFileInput {
  label: String!
  level: Float!
}

enum FileEncoding {
  SHIFT_JIS
  UTF_8
}

type MagicLinkResult {
  magicLinkUrl: String!
  success: Boolean!
}

type Mutation {
  createSimfile(input: CreateSimfileInput!): Simfile!
  deleteSimfile(id: ID!): DeleteResult!
  generateMagicLink: MagicLinkResult!
  updateSimfile(id: ID!, input: UpdateSimfileInput!): Simfile!
  uploadScores(input: UploadScoresInput!): UploadScoresResult!
  upsertUserProfile(input: UpsertUserProfileInput!): UserProfile!
}

type Query {
  healthz: String!
  me: UserProfile!
  myScoredSimfiles(page: Int = 1, pageSize: Int = 20): SimfileConnection!
  nextDisplayId: Int!
  simfile(id: ID!): Simfile
  simfileSearch(excludeIds: [ID!], limit: Int = 8, query: String!): [SimfileSearchResult!]!
  simfiles(page: Int = 1, pageSize: Int = 20, scope: SimfileScope!, search: String): SimfileConnection!
}

type R2File {
  key: String!
  size: Int!
  uploaded: String!
}

type Score {
  achievementRate: Float
  cleared: Boolean!
  displayOrder: Int
  fullCombo: Boolean!
  good: Int
  great: Int
  id: ID!
  isBest: Boolean!
  maxCombo: Int
  miss: Int
  perfect: Int
  performedAt: String
  poor: Int
  rankLabel: String
  score: Int
}

input ScoreInput {
  achievementRate: Float
  cleared: Boolean!
  displayOrder: Int
  fullCombo: Boolean!
  good: Int
  great: Int
  isBest: Boolean!
  maxCombo: Int
  miss: Int
  perfect: Int
  performedAt: String
  poor: Int
  rankLabel: String
  score: Int
}

type Simfile {
  artist: String!
  bpm: Float!
  createdAt: String!
  displayId: Int
  downloadUrl: String
  dtxFiles: [DtxFile!]!
  durationSeconds: Int
  files: [R2File!]!
  genre: String
  hasUploadedFiles: Boolean!
  id: ID!
  isPublished: Boolean!
  previewUrl: String
  publishDate: String!
  tags: [String!]!
  title: String!
  updatedAt: String!
  userId: ID
  videoPreviewUrl: String
}

type SimfileConnection {
  count: Int!
  data: [Simfile!]!
}

enum SimfileScope {
  MINE
  PUBLISHED
}

type SimfileSearchResult {
  artist: String!
  bpm: Float!
  id: ID!
  isPublished: Boolean!
  title: String!
}

"""
A chart that was excluded from the upload. chartId is the requested chart ID, or the sentinel "*" when the entire payload was rejected (e.g. too many charts) rather than a single chart.
"""
type SkippedChart {
  """
  The skipped chart ID, or "*" (sentinel) when the skip applies to the whole upload batch rather than a specific chart.
  """
  chartId: ID!
  reason: String!
}

input UpdateSimfileInput {
  artist: String
  bpm: Float
  displayId: Int
  downloadUrl: String
  isPublished: Boolean
  previewUrl: String
  publishDate: String
  title: String
  videoPreviewUrl: String
}

input UploadScoresInput {
  charts: [ChartScoresInput!]!
}

type UploadScoresResult {
  insertedScores: Int!
  skipped: [SkippedChart!]!
  updatedCharts: Int!
}

input UpsertUserProfileInput {
  username: String!
}

type UserProfile {
  userId: ID!
  username: String!
}