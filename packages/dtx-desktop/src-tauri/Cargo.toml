[package]
name = "dtx-desktop"
version = "1.0.0"
description = "Drumery desktop app"
authors = ["Hapadona"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "dtx_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dtx-desktop"
path = "src/main.rs"

[features]
default = ["google-drive"]
google-drive = ["dep:keyring"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-recursion = "1"
async-trait = "0.1"
base64 = "0.23"
dirs = "6"
encoding_rs = "0.8"
futures-util = "0.3"
httpdate = "1"
rand = "0.8"
reqwest = { version = "=0.12.15", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-wdio = { version = "1.2", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2", optional = true }
thiserror = "2"
ts-rs = "12.0"
time = { version = "=0.3.54", features = ["formatting"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
zeroize = "=1.9.0"
zip = "=4.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"], optional = true }
security-framework = "=3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
png = "0.18"
tempfile = "=3.27.0"
tauri = { version = "2", features = ["test"] }
wiremock = "0.6"
