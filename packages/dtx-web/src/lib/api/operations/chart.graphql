fragment SimfileFull on Simfile {
	id
	displayId
	title
	artist
	bpm
	userId
	isPublished
	downloadUrl
	previewUrl
	videoPreviewUrl
	publishDate
	createdAt
	updatedAt
	dtxFiles {
		level
		label
	}
}

# Preview-only: selects the R2 `fileUrl` for each level so the /preview page can
# fetch + parse the chart. This is deliberately a separate query — NOT part of
# SimfileFull — because `DtxFile.fileUrl` throws INTERNAL when its R2 object is
# missing, and (with defaultFieldNullability: false) that would null-propagate
# and break the entire simfiles/list/detail response. Scoping fileUrl to this
# single-chart query isolates the throw to the one consumer that needs the URL.
query GetPreviewSimfile($id: ID!) {
	simfile(id: $id) {
		id
		title
		artist
		dtxFiles {
			level
			label
			fileUrl
		}
	}
}

fragment SimfileWithFiles on Simfile {
	...SimfileFull
	files {
		key
		size
		uploaded
	}
	hasUploadedFiles
}

query ListSimfiles($scope: SimfileScope!, $search: String, $page: Int, $pageSize: Int) {
	simfiles(scope: $scope, search: $search, page: $page, pageSize: $pageSize) {
		count
		data {
			...SimfileFull
			hasUploadedFiles
		}
	}
}

query GetSimfile($id: ID!) {
	simfile(id: $id) {
		...SimfileWithFiles
	}
}

mutation UpdateSimfile($id: ID!, $input: UpdateSimfileInput!) {
	updateSimfile(id: $id, input: $input) {
		...SimfileWithFiles
	}
}

mutation DeleteSimfile($id: ID!) {
	deleteSimfile(id: $id) {
		id
		deleted
		partialDeletion
		message
	}
}
