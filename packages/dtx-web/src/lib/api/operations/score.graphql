query MyScoredSimfiles($page: Int, $pageSize: Int) {
	myScoredSimfiles(page: $page, pageSize: $pageSize) {
		count
		data {
			id
			title
			artist
			dtxFiles {
				id
				label
				level
				myChartScore {
					playCount
					clearCount
					fullCombo
					maxCombo
					bestAchievementRate
					bestRankLabel
					lastPlayedAt
					scores {
						id
						isBest
						score
						achievementRate
						rankLabel
						cleared
						perfect
						great
						good
						poor
						miss
						performedAt
						displayOrder
					}
				}
			}
		}
	}
}

mutation UploadScores($input: UploadScoresInput!) {
	uploadScores(input: $input) {
		updatedCharts
		insertedScores
		skipped {
			chartId
			reason
		}
	}
}
